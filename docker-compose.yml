# ============================================================
# Vocero CRM — adaptado para Coolify (sin Caddy)
# Coolify usa su propio proxy (Traefik) para el dominio y el HTTPS,
# así que aquí solo van la app y Postgres. El dominio se configura
# en la UI de Coolify, no en este archivo.
#
# La imagen ghcr.io/kevinrivm/vocero-crm aún no tiene releases
# publicados, así que se construye siempre desde el código del repo
# (build: .) en vez de intentar descargarla.
# ============================================================
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vocero
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-v25.0}
      OPENROUTER_API_TOKEN: ${OPENROUTER_API_TOKEN:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_JUDGE_MODEL: ${OPENROUTER_JUDGE_MODEL:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}
      AGENT_COALESCE_MS: ${AGENT_COALESCE_MS:-6000}
      # Opcionales: vacías = apagadas (guía de cada una en .env.example del repo).
      CHANNELS: ${CHANNELS:-}
      AGENDA: ${AGENDA:-}
      ATRIBUCION: ${ATRIBUCION:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      BRAIN_HEALTH_URL: ${BRAIN_HEALTH_URL:-}
    volumes:
      # Adjuntos, logo e icono. Sin este volumen se pierden al recrear el contenedor.
      - vocero_app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    # el HEALTHCHECK vive en el Dockerfile (/api/health)

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vocero
    volumes:
      - vocero_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocero"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vocero_pg:
  vocero_app_data:
